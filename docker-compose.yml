services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantum-alpha-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - QUANTUM_BACKEND=simulator
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000/api/v1
    container_name: quantum-alpha-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
